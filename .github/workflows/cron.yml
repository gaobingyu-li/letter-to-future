name: Letter Delivery Cron

on:
  schedule:
    # 每 1 分钟执行一次
    - cron: '* * * * *'
  workflow_dispatch: # 允许你在 GitHub Actions 页面手动点击触发测试

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate Required Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing secret SUPABASE_URL"
            missing=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing secret SUPABASE_ANON_KEY"
            missing=1
          fi
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "::error::Missing secret FEISHU_WEBHOOK"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "Required secrets check passed."

      - name: Deliver Due Letters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node .github/scripts/deliver-letters.mjs
