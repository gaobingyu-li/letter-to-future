name: Letter Delivery Cron

on:
  schedule:
    # 每 1 分钟执行一次
    - cron: '* * * * *'
  workflow_dispatch: # 允许你在 GitHub Actions 页面手动点击触发测试

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deliver Due Letters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node .github/scripts/deliver-letters.mjs
