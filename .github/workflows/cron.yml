name: Letter Delivery Cron

on:
  schedule:
    # 每 1 分钟执行一次
    - cron: '* * * * *'
  workflow_dispatch: # 允许你在 GitHub Actions 页面手动点击触发测试

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify Cron Endpoint
        run: |
          curl -X POST ${{ secrets.CRON_URL }} \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"
